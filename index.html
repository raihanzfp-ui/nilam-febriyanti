<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nilam Febriyanti 💜</title>
<style>
body{font-family:Arial;background:linear-gradient(#f8f0ff,#efe4ff);padding:20px;max-width:900px;margin:auto}
.card{background:white;border-radius:18px;padding:15px;margin-bottom:15px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.st{position:fixed;font-size:28px;pointer-events:none;opacity:.95}
h1{text-align:center;color:#8a63d2}
input,select,button{padding:10px;margin:4px;border-radius:8px;border:1px solid #d6bcfa}
button{background:#b794f4;color:white;border:none}
table{width:100%;border-collapse:collapse;background:white}
th{background:#d6bcfa} th,td{border:1px solid #ddd;padding:8px;text-align:center}
</style>
</head>
<body>

<div class="st" style="top:10px;left:10px">🧸</div>
<div class="st" style="top:30px;right:20px">💜</div>
<div class="st" style="top:120px;left:40px">🌷</div>
<div class="st" style="top:170px;right:60px">🦋</div>
<div class="st" style="top:260px;left:15px">💕</div>
<div class="st" style="top:340px;right:10px">🌸</div>
<div class="st" style="top:430px;left:60px">✨</div>
<div class="st" style="top:520px;right:80px">🎀</div>
<div class="st" style="top:610px;left:25px">💖</div>
<div class="st" style="bottom:90px;right:30px">🌺</div>
<div class="st" style="bottom:20px;left:120px">🧸</div>
<div class="st" style="bottom:40px;right:120px">💜</div>

<div class="card">
<h1>💜 Nilam Febriyanti 💜</h1>
<p style="text-align:center">🌷 Catatan Pemasukan & Pengeluaran 🌷</p>
<h2 style="text-align:center">Saldo: Rp <span id="saldo">0</span> 💕</h2>
</div>

<div class="card">
<input id="ket" placeholder="📝 Keterangan">
<input id="nom" placeholder="💰 Nominal">
<select id="jenis">
<option value="masuk">💰 Pemasukan</option>
<option value="keluar">🛍️ Pengeluaran</option>
</select>
<button onclick="tambah()">Simpan 💜</button>
</div>

<table>
<thead>
<tr><th>📅 Tanggal</th><th>📝 Keterangan</th><th>💰 Pemasukan</th><th>🛍️ Pengeluaran</th><th>💜 Saldo</th></tr>
</thead>
<tbody id="tb"></tbody>
</table>

<script>
let data=JSON.parse(localStorage.getItem('nilamData')||'[]');

document.getElementById('nom').addEventListener('input',function(e){
 let a=e.target.value.replace(/[^0-9]/g,'');
 e.target.value=a.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
});

function rp(n){return Number(n).toLocaleString('id-ID');}

function render(){
 let saldo=0;
 const tb=document.getElementById('tb');
 tb.innerHTML='';
 if(data.length===0){
  tb.innerHTML='<tr><td>🌷</td><td>Belum ada data</td><td>-</td><td>-</td><td>🧸</td></tr>';
 }
 data.forEach(i=>{
   saldo += i.jenis==='masuk'?i.nom:-i.nom;
   tb.innerHTML += `<tr><td>${i.tgl}</td><td>${i.ket}</td><td>${i.jenis==='masuk'?rp(i.nom):'-'}</td><td>${i.jenis==='keluar'?rp(i.nom):'-'}</td><td>${rp(saldo)}</td></tr>`;
 });
 document.getElementById('saldo').textContent=rp(saldo);
}

function tambah(){
 const ket=document.getElementById('ket').value.trim();
 const nom=document.getElementById('nom').value.replace(/\./g,'');
 const jenis=document.getElementById('jenis').value;
 if(!ket || !nom){ alert('Isi data dulu ya 💜'); return; }

 data.push({
  tgl:new Date().toLocaleDateString('id-ID'),
  ket:ket,
  nom:Number(nom),
  jenis:jenis
 });

 localStorage.setItem('nilamData',JSON.stringify(data));
 document.getElementById('ket').value='';
 document.getElementById('nom').value='';
 render();
}
render();
</script>
</body>
</html>
