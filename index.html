<script>
let data=JSON.parse(localStorage.getItem('nilamData')||'[]');

document.getElementById('nom').addEventListener('input',function(e){
 let a=e.target.value.replace(/[^0-9]/g,'');
 e.target.value=a.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
});

function rp(n){
 return Number(n).toLocaleString('id-ID');
}

function simpanData(){
 localStorage.setItem('nilamData',JSON.stringify(data));
}

function render(){
 let saldo=0;
 const tb=document.getElementById('tb');
 tb.innerHTML='';

 if(data.length===0){
  tb.innerHTML='<tr><td>🌷</td><td>Belum ada data</td><td>-</td><td>-</td><td>🧸</td><td>-</td></tr>';
 }

 data.forEach((i,index)=>{
   saldo += i.jenis==='masuk'?i.nom:-i.nom;

   tb.innerHTML += `
   <tr>
    <td>${i.tgl}</td>
    <td>${i.ket}</td>
    <td>${i.jenis==='masuk'?rp(i.nom):'-'}</td>
    <td>${i.jenis==='keluar'?rp(i.nom):'-'}</td>
    <td>${rp(saldo)}</td>
    <td>
      <button onclick="editData(${index})">✏️</button>
      <button onclick="hapusData(${index})">🗑️</button>
    </td>
   </tr>`;
 });

 document.getElementById('saldo').textContent=rp(saldo);
}

function tambah(){
 const ket=document.getElementById('ket').value.trim();
 const nom=document.getElementById('nom').value.replace(/\./g,'');
 const jenis=document.getElementById('jenis').value;

 if(!ket || !nom){
  alert('Isi data dulu ya 💜');
  return;
 }

 data.push({
  tgl:new Date().toLocaleDateString('id-ID'),
  ket:ket,
  nom:Number(nom),
  jenis:jenis
 });

 simpanData();

 document.getElementById('ket').value='';
 document.getElementById('nom').value='';

 render();
}

function hapusData(index){
 if(confirm('Yakin mau hapus data ini? 🗑️')){
   data.splice(index,1);
   simpanData();
   render();
 }
}

function editData(index){

 let item=data[index];

 let ketBaru=prompt('📝 Edit Keterangan',item.ket);
 if(ketBaru===null) return;

 let nominalBaru=prompt('💰 Edit Nominal',item.nom);
 if(nominalBaru===null) return;

 let jenisBaru=prompt(
  'Ketik: masuk atau keluar',
  item.jenis
 );

 if(jenisBaru===null) return;

 jenisBaru=jenisBaru.toLowerCase();

 if(jenisBaru!=='masuk' && jenisBaru!=='keluar'){
   alert('Harus masuk atau keluar');
   return;
 }

 data[index]={
   ...item,
   ket:ketBaru,
   nom:Number(nominalBaru),
   jenis:jenisBaru
 };

 simpanData();
 render();
}

render();
</script>
